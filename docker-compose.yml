version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openledger
      POSTGRES_PASSWORD: openledger
      POSTGRES_DB: openledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://openledger:openledger@db:5432/openledger
      DATABASE_URL_SYNC: postgresql://openledger:openledger@db:5432/openledger
      SECRET_KEY: dev-secret-change-in-production
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "alembic upgrade head &&
               uvicorn openledger.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
