services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-openledger}
    # Do NOT expose 5432 to host in production — only expose for local dev
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openledger}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-openledger}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-openledger}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-openledger}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-openledger}
      DEBUG: "${DEBUG:-true}"
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "alembic upgrade head &&
               uvicorn openledger.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - backend
      - frontend

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - frontend

volumes:
  pgdata:

networks:
  backend:
  frontend:
