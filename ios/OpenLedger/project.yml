name: OpenLedger
options:
  bundleIdPrefix: com.openledger
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: OpenLedger/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  OpenLedger:
    type: application
    platform: iOS
    sources:
      - path: OpenLedger
        excludes:
          - "**/*.xcassets"
    resources:
      - path: OpenLedger/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openledger.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: OpenLedger/Info.plist
      properties:
        CFBundleDisplayName: OpenLedger
        CFBundleName: OpenLedger
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "OpenLedger uses the camera to capture receipts for OCR processing"
